name: session

# GitHub cron is best-effort: on 2026-09-22 it dropped all four hourly slots
# and the bot never started. So the schedule is only one of three starters:
#   1. dense morning slots (every 10 min, 08:00-10:50 EDT) so one lands;
#   2. hourly slots through the session as a backstop;
#   3. kick.sh on the Mac, which dispatches a run if none is active.
# Once running, a job that hits its 6h budget dispatches its own successor,
# so a started session never depends on cron again. Early runs wait for the
# open (up to 45 min); runs outside the session exit immediately.
on:
  schedule:
    - cron: "*/10 12-14 * * 1-5"
    - cron: "7 15-20 * * 1-5"
  workflow_dispatch:
    inputs:
      budget_min:
        description: "Minutes this job may run (default 340)"
        default: "340"

permissions:
  contents: write
  actions: write     # a job dispatches its own successor

concurrency:
  group: odte-session
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - run: pip install -r requirements-cloud.txt

      - name: Check out state branch
        run: |
          git config --global user.name "odte-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin state
          git worktree add -q state origin/state
          git -C state checkout -q -B state

      - name: Unit tests
        run: |
          python test_engine.py
          python test_swing.py

      # Entries need the options chain, which is only fetched when a signal
      # fires. Probe it up front so a Yahoo block shows up when the job
      # starts, not at the first breakout. Non-fatal: position management
      # still runs.
      - name: Options chain smoke check
        continue-on-error: true
        run: |
          python - <<'PY'
          import yfinance as yf
          for sym in ("^SPX", "QQQ"):
              t = yf.Ticker(sym); exp = t.options[0]
              ch = t.option_chain(exp)
              n = int(((ch.calls.bid > 0) & (ch.calls.ask > 0)).sum())
              print(f"{sym} chain {exp}: {len(ch.calls)} calls, {n} two-sided")
              assert n > 0, f"{sym}: no two-sided quotes"
          PY

      - name: Run session
        env:
          ODTE_STATE_DIR: state
          BUDGET_MIN: ${{ inputs.budget_min || '340' }}
          GH_TOKEN: ${{ github.token }}
        run: python cloud_loop.py
