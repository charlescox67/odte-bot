name: session

# The Yahoo-powered fallback session.
#
# This ran the book outright from 2026-09-22 to 2026-10-09 and is now the
# safety net under the Mac, which trades the same book on live IBKR quotes.
# Both read the `state` branch; state_repo's heartbeat decides which one is
# allowed to write, and the Mac always wins while it is actually trading.
on:
  # BACK ON since 2026-10-17, now as the FALLBACK rather than the main bot.
  # It was off for a week because a cloud session would have been a second
  # writer on the same book. It no longer is: cloud_loop asks state_repo
  # whether the Mac has traded recently and stands down if so, so this session
  # runs all day and only picks up the book when the Mac does not. That is
  # what the week of 2026-10-12..16 needed - the Mac ticked 913 times into a
  # TWS that was never started, and nothing traded for five sessions.
  schedule:
    # GitHub cron is best-effort and has dropped whole mornings, so the slots
    # are dense and the job itself hands off at its 6h budget.
    - cron: "*/15 10-11 * * 1-5"
    - cron: "*/10 12-14 * * 1-5"
    - cron: "*/10 15-20 * * 1-5"
  workflow_dispatch:
    inputs:
      budget_min:
        description: "Minutes this job may run (default 340)"
        default: "340"

permissions:
  contents: write
  actions: write     # a job dispatches its own successor

concurrency:
  group: odte-session
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - run: pip install -r requirements-cloud.txt

      - name: Check out state branch
        run: |
          git config --global user.name "odte-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin state
          git worktree add -q state origin/state
          git -C state checkout -q -B state

      - name: Unit tests
        run: |
          python test_engine.py
          python test_swing.py

      # Entries need the options chain, which is only fetched when a signal
      # fires. Probe it up front so a Yahoo block shows up when the job
      # starts, not at the first breakout. Non-fatal: position management
      # still runs.
      - name: Options chain smoke check
        continue-on-error: true
        run: |
          python - <<'PY'
          import yfinance as yf
          for sym in ("SPY", "QQQ"):
              t = yf.Ticker(sym); exp = t.options[0]
              ch = t.option_chain(exp)
              n = int(((ch.calls.bid > 0) & (ch.calls.ask > 0)).sum())
              print(f"{sym} chain {exp}: {len(ch.calls)} calls, {n} two-sided")
              assert n > 0, f"{sym}: no two-sided quotes"
          PY

      - name: Run session
        env:
          ODTE_STATE_DIR: state
          ODTE_WRITER: cloud      # state_repo: stand down while the Mac trades
          BUDGET_MIN: ${{ inputs.budget_min || '340' }}
          GH_TOKEN: ${{ github.token }}
        run: python cloud_loop.py
