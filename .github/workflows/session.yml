name: session

# The Yahoo-powered fallback session, kept on manual dispatch only.
#
# This ran the book every day from 2026-09-22 to 2026-10-09, because GitHub
# cron is best-effort and a Mac sleeps; the dense cron slots, the self-handoff
# at the 6h job cap, and kick.sh on the Mac were all there to make sure one
# session started each morning. It all still works. It is simply not allowed
# to start by itself any more - see the note on the schedule below.
on:
  # SCHEDULE DELIBERATELY OFF since 2026-10-09. The bot now reads live IBKR
  # quotes from a TWS that only runs on the Mac, so the Mac is the only
  # machine that can trade. A cloud session firing on its own would be a
  # SECOND writer on the same `state` branch and the same book - the two would
  # overwrite each other's trades. Starting one by hand is still fine (it runs
  # on Yahoo, 20 minutes stale), but only while the Mac is NOT running.
  #
  # To restore the old always-on cloud schedule, uncomment these and stop the
  # com.charles.odte-bot launch agent on the Mac. Never both.
  #   schedule:
  #     - cron: "*/15 10-11 * * 1-5"
  #     - cron: "*/10 12-14 * * 1-5"
  #     - cron: "*/10 15-20 * * 1-5"
  workflow_dispatch:
    inputs:
      budget_min:
        description: "Minutes this job may run (default 340)"
        default: "340"

permissions:
  contents: write
  actions: write     # a job dispatches its own successor

concurrency:
  group: odte-session
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - run: pip install -r requirements-cloud.txt

      - name: Check out state branch
        run: |
          git config --global user.name "odte-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin state
          git worktree add -q state origin/state
          git -C state checkout -q -B state

      - name: Unit tests
        run: |
          python test_engine.py
          python test_swing.py

      # Entries need the options chain, which is only fetched when a signal
      # fires. Probe it up front so a Yahoo block shows up when the job
      # starts, not at the first breakout. Non-fatal: position management
      # still runs.
      - name: Options chain smoke check
        continue-on-error: true
        run: |
          python - <<'PY'
          import yfinance as yf
          for sym in ("SPY", "QQQ"):
              t = yf.Ticker(sym); exp = t.options[0]
              ch = t.option_chain(exp)
              n = int(((ch.calls.bid > 0) & (ch.calls.ask > 0)).sum())
              print(f"{sym} chain {exp}: {len(ch.calls)} calls, {n} two-sided")
              assert n > 0, f"{sym}: no two-sided quotes"
          PY

      - name: Run session
        env:
          ODTE_STATE_DIR: state
          BUDGET_MIN: ${{ inputs.budget_min || '340' }}
          GH_TOKEN: ${{ github.token }}
        run: python cloud_loop.py
